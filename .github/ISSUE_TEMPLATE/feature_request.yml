name: Feature request
description: Suggest a measurement, a view, a circuit profile or a workflow improvement.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Have a look at [docs/TODO.md](https://github.com/drlholloway/sightings/blob/main/docs/TODO.md) and the [wiki](https://github.com/drlholloway/sightings/wiki) first; it may already exist or be planned.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task, not the button. "Match four transistors for a Big Muff" is more useful than "add a column".
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: How you imagine it working. Sketches and examples from other tools welcome.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Identify and readings
        - Curves and sweeps
        - DCA55-equivalent or leakage measurements
        - Parts, bins and matching
        - Pedal Builder circuits
        - History and export
        - Packaging and installation
        - Other
  - type: textarea
    id: hardware
    attributes:
      label: Hardware you could test on
      description: Platform, and whether you have a DCA75 and the parts involved.
