# Dependabot version updates. Security alerts and fixes are enabled in the
# repository settings; this schedules routine bumps.
version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    groups:
      dart:
        patterns: ["*"]
  - package-ecosystem: gradle
    directory: /apps/workbench/android
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
