name: test
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
# Least privilege: these jobs only read the repository.
permissions:
  contents: read

jobs:
  dart:
    name: Dart packages (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: libusb (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0 libusb-1.0-0-dev
      - name: libusb (macOS)
        if: runner.os == 'macOS'
        run: brew install libusb
      - run: dart pub get
      - run: dart analyze
      - name: test packages
        run: |
          for p in packages/dca75_protocol packages/dca75_transport packages/dca75_device packages/dca75_circuits packages/dca75_store tools/dca75_cli; do
            (cd $p && dart test)
          done
      - name: app widget tests
        run: cd apps/workbench && flutter test
  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: dart pub get
      - run: cd apps/workbench && flutter build apk --debug
  macos:
    name: macOS package tests and debug app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: brew install libusb
      - run: dart pub get
      - name: test packages
        run: |
          for p in packages/dca75_protocol packages/dca75_transport packages/dca75_device packages/dca75_circuits packages/dca75_store tools/dca75_cli; do
            (cd $p && dart test)
          done
      - run: cd apps/workbench && flutter build macos --debug
  linux:
    name: Linux debug app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libusb-1.0-0-dev
      - run: dart pub get
      - run: cd apps/workbench && flutter build linux --release
      - name: package bundle
        run: |
          VERSION=$(grep '^version:' apps/workbench/pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          STAGE=sightings-linux-x64-$VERSION
          mkdir -p $STAGE
          cp -r apps/workbench/build/linux/x64/release/bundle/. $STAGE/
          cp packaging/linux/60-dca75.rules $STAGE/
          cp packaging/linux/README-linux.md $STAGE/README.md
          tar czf $STAGE.tar.gz $STAGE
      - name: flatpak bundle
        run: |
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08
          flatpak-builder --user --force-clean --repo=flatpak-repo flatpak-build packaging/flatpak/dev.laneholloway.Sightings.yml
          flatpak build-bundle flatpak-repo sightings-linux-x64-dev.flatpak dev.laneholloway.Sightings
          ls -la *.flatpak
      - uses: actions/upload-artifact@v4
        with:
          name: sightings-linux-x64
          path: |
            sightings-linux-x64-*.tar.gz
            sightings-linux-x64-*.flatpak
          retention-days: 14
