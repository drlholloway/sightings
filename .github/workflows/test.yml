name: test
# Private repo: macOS runners cost 10x, so macOS jobs run only on tags or by
# hand; Ubuntu package tests and the Linux/Android builds run on every push.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  dart:
    name: Dart packages (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: libusb (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0 libusb-1.0-0-dev
      - name: libusb (macOS)
        if: runner.os == 'macOS'
        run: brew install libusb
      - run: dart pub get
      - run: dart analyze
      - name: test packages
        run: |
          for p in packages/dca75_protocol packages/dca75_transport packages/dca75_device packages/dca75_store tools/dca75_cli; do
            (cd $p && dart test)
          done
      - name: app widget tests
        run: cd apps/workbench && flutter test
  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: dart pub get
      - run: cd apps/workbench && flutter build apk --debug
  macos:
    name: macOS package tests and debug app
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: brew install libusb
      - run: dart pub get
      - name: test packages
        run: |
          for p in packages/dca75_protocol packages/dca75_transport packages/dca75_device packages/dca75_store tools/dca75_cli; do
            (cd $p && dart test)
          done
      - run: cd apps/workbench && flutter build macos --debug
  linux:
    name: Linux debug app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libusb-1.0-0-dev
      - run: dart pub get
      - run: cd apps/workbench && flutter build linux --debug
