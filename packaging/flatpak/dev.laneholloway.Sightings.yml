# Flatpak manifest. Packages the prebuilt Linux bundle (apps/workbench/build/
# linux/x64/release/bundle) into the Freedesktop runtime, which provides GTK 3
# and libusb-1.0. Build (from the repo root, after `flutter build linux --release`):
#   flatpak-builder --user --install-deps-from=flathub --force-clean --repo=repo \
#       build-dir packaging/flatpak/dev.laneholloway.Sightings.yml
#   flatpak build-bundle repo sightings.flatpak dev.laneholloway.Sightings
app-id: dev.laneholloway.Sightings
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: sightings
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  # Raw USB access to the DCA75; Flatpak has no finer-grained USB permission.
  - --device=all
modules:
  - name: sightings
    buildsystem: simple
    build-commands:
      - mkdir -p /app/sightings && cp -r bundle/. /app/sightings/
      - install -Dm755 sightings.sh /app/bin/sightings
      - install -Dm644 dev.laneholloway.Sightings.desktop /app/share/applications/dev.laneholloway.Sightings.desktop
      - install -Dm644 dev.laneholloway.Sightings.metainfo.xml /app/share/metainfo/dev.laneholloway.Sightings.metainfo.xml
      - install -Dm644 icon_256.png /app/share/icons/hicolor/256x256/apps/dev.laneholloway.Sightings.png
      - install -Dm644 icon_512.png /app/share/icons/hicolor/512x512/apps/dev.laneholloway.Sightings.png
    sources:
      - type: dir
        path: ../../apps/workbench/build/linux/x64/release/bundle
        dest: bundle
      - type: file
        path: sightings.sh
      - type: file
        path: dev.laneholloway.Sightings.desktop
      - type: file
        path: dev.laneholloway.Sightings.metainfo.xml
      - type: file
        path: ../../apps/workbench/assets/icon/icon_256.png
      - type: file
        path: ../../apps/workbench/assets/icon/icon_512.png
