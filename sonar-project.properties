# What SonarQube Cloud analyzes (.github/workflows/test.yml, the SonarQube
# job). The organization and project key come from the workflow.
#
# SonarQube Cloud analyzes the whole repository. It ignores sonar.sources,
# sonar.tests and sonar.test.inclusions, so the scope is set only by what's
# left out, here and under coverage.

# Flutter's generated Linux runner and drift's generated database code; none
# of it is written by hand.
sonar.exclusions=apps/workbench/linux/**,**/*.g.dart

# Written by the tests in the SonarQube job. Each package's report also
# counts the lines it runs in the packages below it.
sonar.dart.lcov.reportPaths=packages/dca75_protocol/coverage/lcov.info,packages/dca75_transport/coverage/lcov.info,packages/dca75_device/coverage/lcov.info,packages/dca75_circuits/coverage/lcov.info,packages/dca75_store/coverage/lcov.info,tools/dca75_cli/coverage/lcov.info,apps/workbench/coverage/lcov.info

# Left out of the coverage figure, so it describes Sightings' own Dart code:
# the tests themselves; the native Android USB bridge and macOS runner
# (tried on a phone and a Mac with a real unit); the fake transport the
# tests are built on; the screenshot tour; and the packaging and icon
# scripts.
sonar.coverage.exclusions=**/test/**,apps/workbench/android/**,apps/workbench/macos/**,packages/dca75_transport/lib/src/fake_transport.dart,apps/workbench/lib/app/tour.dart,packaging/**
